.setup .chip.on{background:var(--navy);color:#fff}

</style>

    BZ_SURVEY.forEach(function(q){i++;if(q.sec!==last){h+='<div style="margin:16px 4px 6px;font-weight:800;color:#fff;background:var(--navy);display:inline-block;padding:3px 12px;border-radius:8px;font-size:14px">'+esc(q.sec)+'</div>';last=q.sec;}
      h+='<div class="card"><h2 style="font-size:17px">'+i+'. '+esc(q.q)+(q.t==='multi'?' <small>여러 개 골라도 돼</small>':'')+'</h2>';
      if(q.o){var sel=SA[q.k]||[];h+='<div class="bk">'+q.o.map(function(o){return '<button class="bkc'+(sel.indexOf(o)>-1?' on':'')+'" data-sq="'+q.k+'" data-so="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>';}
      if(q.t==='text')h+='<input class="t w" data-st="'+q.k+'" value="'+esc(SA[q.k]||'')+'" placeholder="여기에 써 줘 (안 써도 돼)">';
      if(q.more)h+='<input class="t w" style="margin-top:8px;font-size:15px" data-sm="'+q.k+'" value="'+esc(SM[q.k]||'')+'" placeholder="'+esc(q.more)+'">';
      h+='</div>';});
    h+='<button class="send" id="svSend">설문 보내기 ✅</button><div style="height:30px"></div>';
    out.innerHTML=h;window.scrollTo(0,0);
    var bk=document.getElementById('svBack');if(bk)bk.onclick=function(){open0(autoMode());};
    out.querySelectorAll('[data-sq]').forEach(function(c){c.onclick=function(){var k=c.getAttribute('data-sq'),o=c.getAttribute('data-so'),q=BZ_SURVEY.filter(function(x){return x.k===k;})[0],a=SA[k]||[];
      if(q.t==='one')a=a[0]===o?[]:[o];else{var j=a.indexOf(o);if(j>-1)a.splice(j,1);else a.push(o);}SA[k]=a;c.parentNode.querySelectorAll('[data-sq]').forEach(function(x){x.classList.toggle('on',a.indexOf(x.getAttribute('data-so'))>-1);});};});
    out.querySelectorAll('[data-st]').forEach(function(x){x.oninput=function(){SA[x.getAttribute('data-st')]=x.value;};});
    out.querySelectorAll('[data-sm]').forEach(function(x){x.oninput=function(){SM[x.getAttribute('data-sm')]=x.value;};});
    document.getElementById('svSend').onclick=function(){var n=Object.keys(SA).filter(function(k){var v=SA[k];return Array.isArray(v)?v.length:String(v||'').trim();}).length;
      if(n<5){toast('조금만 더! 아는 것만이라도 골라 줘 ('+n+'개 답함)');return;}
      var b=this;b.disabled=true;b.textContent='보내는 중…';
      SB.rpc('stu_survey',{p_code:CODE,p_ans:{a:SA,more:SM}}).then(function(r){if(r.error||r.data!==true){b.disabled=false;b.textContent='설문 보내기 ✅';toast('저장 안 됨 — 다시 눌러 줘');return;}
        CTX.survey_last=CTX.today||'오늘';out.innerHTML='<div class="card done-scr"><div class="e">🙌</div><div class="m">고마워! 쌤들이 꼭 참고할게</div><button class="back" style="margin-top:20px" id="svGo">오늘 기록하러 가기 →</button></div>';
        document.getElementById('svGo').onclick=function(){open0(autoMode());};});};}

  function hwPrev(){var n0=LASTN[0],pr=CTX.prev_rep;if(pr&&pr.hw&&pr.hw.length&&(!n0||!(n0.hw_items||[]).length||String(pr.at||'').slice(0,10)>=String(n0.note_date||'')))return pr.hw;return n0?(n0.hw_items||[]):[];}
  function schedNow(){var raw=String(CTX.sched||''),w='일월화수목금토'.charAt(new Date().getDay()),st=null;
    raw.split(/[,·\/\n;]+/).forEach(function(part){if(part.indexOf(w)<0)return;var m=part.match(/(\d{1,2})(?::(\d{2}))?\s*[~\-–]/);if(m)st=(+m[1])*60+(+(m[2]||0));});return st;}
  function autoMode(){var mine=CTX.mine||{},st=schedNow(),d=new Date(),now=d.getHours()*60+d.getMinutes();
    if(st!=null)return now<st+40?'start':'end';
    if(!mine.hwc&&hwPrev().length&&!mine.learn)return 'start';return 'end';}
  function open0(m){var old=CTX.mine||{};MODE=m||MODE||autoMode();
    F={hwc:(old.hwc&&old.hwc.length?old.hwc:hwPrev().filter(function(i){return i.book||i.range;}).map(function(i){return {book:i.book||'',range:i.range||'',pct:null};})).map(function(i){return {book:i.book,range:i.range,pct:i.pct==null?null:i.pct};}),
       learn:(old.learn||[]).map(function(i){return {book:i.book,to:i.to!=null?i.to:lastNum(i.range)};}),hw:(old.hw||[]).map(function(i){return {book:i.book,to:i.to!=null?i.to:lastNum(i.range)};}),tests:(old.tests||[]).slice(),say:old.say||''};
    if(!F.learn.length){var n0=LASTN[0]||{},bl=bookList();F.learn=[{book:(n0.learned&&n0.learned[0]&&n0.learned[0].book)||bl[0]||'',to:''}];}
    if(!F.hw.length){var h0=hwPrev();F.hw=[{book:(h0[0]&&h0[0].book)||F.learn[0].book,to:''}];}
    form();}
  function form(){var bl=bookList(),P=[[100,'다 했어'],[75,'거의'],[50,'반쯤'],[25,'조금'],[0,'못 했어']],mine=CTX.mine||{},doneS=!!mine.hwc,doneE=!!mine.learn;
    var h='<div class="card"><div class="row" style="margin:0"><div class="big">'+esc(CTX.name)+'</div></div><div class="pcts" style="margin-top:10px">'+
      '<button class="pc'+(MODE==='start'?' on':'')+'" data-md="start" style="flex:1">🏁 수업 시작'+(doneS?' ✅':'')+'<br><small>지난 숙제 확인</small></button>'+
      '<button class="pc'+(MODE==='end'?' on':'')+'" data-md="end" style="flex:1">🏠 집에 가기 전'+(doneE?' ✅':'')+'<br><small>오늘 진도·숙제</small></button></div><div style="text-align:right;margin-top:8px"><button class="back" id="svOpen" style="font-size:13px;padding:6px 12px'+(svDue()?';border-color:#f2b21b;background:#fff6dc':'')+'">📝 나 소개(설문)'+(svDue()?' — 다시 할 때!':CTX.survey_last?' ✅':'')+'</button></div></div>';
    if(MODE==='start'){
      h+='<div class="card"><h2>📌 지난 숙제 얼마나 했어? <small>솔직하게 — 쌤이 같이 확인해요</small></h2>';
      if(!F.hwc.length)h+='<div class="hint">지난 숙제 기록이 없어요 — 그냥 보내도 돼요</div>';
      F.hwc.forEach(function(i,ix){h+='<div class="ent"><div class="lbl">'+esc(i.book)+' <span class="prev">'+esc(i.range)+'</span></div><div class="pcts" style="margin-top:8px">'+P.map(function(p){return '<button class="pc'+(p[0]===0?' z':'')+(i.pct===p[0]?' on':'')+'" data-hp="'+ix+'" data-v="'+p[0]+'">'+p[1]+'<br><small>'+p[0]+'%</small></button>';}).join('')+'</div></div>';});
      h+='</div><div class="card"><h2>📕 틀린 문제 다시 풀기 <small>곧 열려요</small></h2><div class="hint">채점이 연결되면 여기에 내가 틀린 문제(책·쪽·번호)가 뜨고, 다시 푼 풀이를 📷 사진으로 보낼 수 있어요.</div></div>';
      h+='<button class="send" id="send">보내기 ✅</button><div style="height:30px"></div>';
    } else {
      [['learn','📖 오늘 진도 — 어떤 책 어디까지 나갔어?','쪽까지 나갔어'],['hw','✏️ 숙제 — 어떤 책 어디까지 풀어 오기로 했어?','쪽까지 풀어 올게']].forEach(function(sec){var k=sec[0];
        h+='<div class="card"><h2>'+sec[1]+' <small>책 누르고 → 마지막 쪽 번호만</small></h2>';
        F[k].forEach(function(i,ix){var st=startOf(k,i);
          h+='<div class="ent"><div class="bk">'+bl.map(function(b){return '<button class="bkc'+(i.book===b?' on':'')+'" data-bk="'+k+'" data-i="'+ix+'" data-v="'+esc(b)+'">'+esc(b)+'</button>';}).join('')+'<button class="bkc" data-bkx="'+k+'" data-i="'+ix+'">✍ 다른 책</button></div>'+
            '<div class="row">'+(st!=null?'<span class="prev">'+st+'쪽부터</span>':'')+'<input class="t" type="number" inputmode="numeric" data-to="'+k+'" data-i="'+ix+'" value="'+esc(i.to==null?'':i.to)+'" placeholder="쪽 번호"> <span>'+sec[2]+'</span>'+(F[k].length>1?'<button class="x" data-del="'+k+'" data-i="'+ix+'">✕</button>':'')+'</div></div>';});
        h+='<button class="add" data-add="'+k+'">+ 책 하나 더</button></div>';});
      h+='<div class="card"><h2>📝 오늘 테스트 봤어? <small>안 봤으면 넘어가요</small></h2>';
      F.tests.forEach(function(t,ix){h+='<div class="row"><input class="t w" style="max-width:260px" data-tn="'+ix+'" value="'+esc(t.name)+'" placeholder="무슨 테스트"><input class="t" type="number" inputmode="numeric" data-ts="'+ix+'" value="'+esc(t.score)+'" placeholder="점수"> 점 <button class="x" data-tdel="'+ix+'">✕</button></div>';});
      h+='<button class="add" id="tAdd">+ 테스트 점수 넣기</button></div>';
      h+='<div class="card"><h2>💬 쌤한테 한마디 <small>어려웠던 거 · 질문 — 쌤만 봐요 (부모님께 안 가요)</small></h2><input class="t w" id="say" value="'+esc(F.say||'')+'" placeholder="예: 3번 유형이 헷갈려요"></div>';
      h+='<button class="send" id="send">보내기 ✅</button><div style="height:30px"></div>';}
    out.innerHTML=h;window.scrollTo(0,0);bind();}
  function startOf(k,i){if(!i.book)return null;var e=lastEnd(i.book);if(k==='hw'){var l=F.learn.filter(function(x){return x.book===i.book&&x.to;})[0];if(l)return +l.to+1;}return e!=null?e+1:null;}
  function bind(){
    var so=document.getElementById('svOpen');if(so)so.onclick=function(){sync();survey();};
    out.querySelectorAll('[data-md]').forEach(function(b){b.onclick=function(){sync();MODE=b.getAttribute('data-md');form();};});
    out.querySelectorAll('[data-hp]').forEach(function(b){b.onclick=function(){F.hwc[+b.getAttribute('data-hp')].pct=+b.getAttribute('data-v');form();};});
    out.querySelectorAll('[data-bk]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-bk'),i=+b.getAttribute('data-i');sync();F[k][i].book=b.getAttribute('data-v');form();};});
    out.querySelectorAll('[data-bkx]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-bkx'),i=+b.getAttribute('data-i'),v=prompt('책 이름');if(v&&v.trim()){sync();F[k][i].book=v.trim();form();}};});
    out.querySelectorAll('[data-to]').forEach(function(el){el.oninput=function(){F[el.getAttribute('data-to')][+el.getAttribute('data-i')].to=el.value;};});
    out.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){sync();F[b.getAttribute('data-add')].push({book:'',to:''});form();};});
    out.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){sync();F[b.getAttribute('data-del')].splice(+b.getAttribute('data-i'),1);form();};});
    var ta=document.getElementById('tAdd');if(ta)ta.onclick=function(){sync();F.tests.push({name:'',score:''});form();};
    out.querySelectorAll('[data-tdel]').forEach(function(b){b.onclick=function(){sync();F.tests.splice(+b.getAttribute('data-tdel'),1);form();};});
    document.getElementById('send').onclick=send;}
  function sync(){out.querySelectorAll('[data-to]').forEach(function(el){F[el.getAttribute('data-to')][+el.getAttribute('data-i')].to=el.value;});
    out.querySelectorAll('[data-tn]').forEach(function(el){F.tests[+el.getAttribute('data-tn')].name=el.value;});
    out.querySelectorAll('[data-ts]').forEach(function(el){F.tests[+el.getAttribute('data-ts')].score=el.value;});
    var sy=document.getElementById('say');if(sy)F.say=sy.value;}
  function send(){sync();var data;
    if(MODE==='start'){if(F.hwc.some(function(i){return i.pct==null;})){toast('📌 숙제마다 얼마나 했는지 눌러 줘');return;}
      data={hwc:F.hwc.map(function(i){return {book:i.book,range:i.range,pct:i.pct};}),at_start:new Date().toISOString()};}
    else{var mk=function(k){return F[k].filter(function(i){return i.book&&String(i.to).trim();}).map(function(i){var st=startOf(k,i),to=+i.to;return {book:i.book,to:to,range:(st!=null&&st<=to?st+'~':'')+to+'쪽'};});};
      var learn=mk('learn'),hw=mk('hw');
      if(!learn.length){toast('📖 오늘 어떤 책 몇 쪽까지 나갔는지 넣어 줘');return;}
      if(!hw.length&&!confirm('숙제 없는 날이야? (있으면 [취소] 누르고 넣어 줘)'))return;
      data={learn:learn,hw:hw,tests:F.tests.filter(function(t){return t.name||t.score!=='';}).map(function(t){return {name:t.name||'테스트',score:t.score===''?'':+t.score};}),say:(F.say||'').trim(),at_end:new Date().toISOString()};}
    var b=document.getElementById('send');b.disabled=true;b.textContent='보내는 중…';
    SB.rpc('stu_submit',{p_code:CODE,p_data:data}).then(function(r){
      if(r.error||r.data!==true){b.disabled=false;b.textContent='보내기 ✅';toast('저장 안 됨 — 다시 눌러 줘'+(r.error?' ('+r.error.message+')':''));return;}
      var m=CTX.mine||{};Object.keys(data).forEach(function(k){m[k]=data[k];});CTX.mine=m;var st=MODE==='start';
      out.innerHTML='<div class="card done-scr"><div class="e">'+(st?'👍':'👋')+'</div><div class="m">'+esc(given(CTX.name))+(st?', 확인 끝! 수업 잘 듣자':', 보냈어! 조심히 가~')+'</div><div class="hint" style="margin-top:10px">'+(st?'수업 끝나면 「🏠 집에 가기 전」도 잊지 마':'쌤이 확인하고 부모님께 알림장 보내요')+' · 고칠 게 있으면 다시 열면 돼</div><button class="back" style="margin-top:20px" id="again">✏️ 고치기</button></div>';
      document.getElementById('again').onclick=function(){open0(MODE);};});}
  load();
})();
</script>
</body>
</html>
