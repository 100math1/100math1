<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>백수학 오늘 기록</title>
<meta name="theme-color" content="#1c2163">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
:root{--navy:#1c2163;--yel:#f2b21b;--line:#d6dbe4;--bg:#f4f6fa;--mut:#6b7585;--ok:#1e7e45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:#1d2430;font-size:17px;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--yel);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0}.top .cn{font-size:16px;opacity:.9}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.top button{border:1px solid #fff6;background:#fff2;color:#fff;border-radius:20px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
#conn{font-size:12px;opacity:.8}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(28,33,99,.06)}
.card h2{margin:0 0 12px;font-size:19px;color:var(--navy)}
.card h2 small{font-size:13px;color:var(--mut);font-weight:400;margin-left:6px}
@media (max-width:600px){body{font-size:16px}.card{padding:14px;border-radius:14px}.pc{min-width:0;flex:1;padding:10px 4px;font-size:14px}.bkc{padding:8px 12px;font-size:15px}.big{font-size:22px}.send{font-size:21px;padding:17px}}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.nm{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px 8px;text-align:center;font-size:22px;font-weight:700;cursor:pointer;color:var(--navy)}
.nm:active{transform:scale(.97)}
.nm.done{background:#eef8f1;border-color:#9fd3b0;color:var(--ok)}
.nm small{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-top:4px}
.big{font-size:26px;font-weight:800;color:var(--navy);margin:0 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.lbl{font-weight:700;min-width:150px}
.pcts{display:flex;gap:8px;flex-wrap:wrap}
.pc{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;cursor:pointer;min-width:84px}
.pc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pc.z.on{background:#c0392b;border-color:#c0392b}
.bk{display:flex;gap:8px;flex-wrap:wrap}
.bkc{border:2px solid var(--line);background:#fff;border-radius:22px;padding:9px 16px;font:inherit;font-size:16px;cursor:pointer}
.bkc.on{background:var(--yel);border-color:var(--yel);color:var(--navy);font-weight:800}
input.t{font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:150px}
input.w{width:100%;max-width:520px}
.ent{background:#f7f9fd;border:1px dashed #c8d2e2;border-radius:14px;padding:12px;margin:8px 0}
.add{border:2px dashed #b9c4d8;background:#fff;border-radius:14px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer;color:var(--navy)}
.x{border:0;background:#eef1f6;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.send{display:block;width:100%;border:0;background:var(--navy);color:#fff;border-radius:18px;padding:20px;font:inherit;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--yel)}
.back{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 18px;font:inherit;font-size:16px;cursor:pointer}
.hint{font-size:13px;color:var(--mut)}
.done-scr{text-align:center;padding:70px 20px}.done-scr .e{font-size:80px}.lob{display:grid;gap:12px;margin-top:4px}.lobt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px 16px;font:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(28,33,99,.06)}.lobt .ic{font-size:38px;width:50px;text-align:center;flex:none}.lobt b{display:block;font-size:20px;color:var(--navy)}.lobt small{display:block;font-size:13px;color:var(--mut);margin-top:2px}.lobt .bd{margin-left:auto;background:#c0392b;color:#fff;border-radius:12px;padding:2px 9px;font-size:13px;font-weight:700;flex:none}.lobt:active{background:#f6f7fb}.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eee;align-items:flex-start}.ev .dd{flex:none;width:64px;font-weight:800;color:var(--navy);font-size:14px;line-height:1.3}.ev .dd small{display:block;font-weight:400;color:var(--mut);font-size:12px}.ev .tt{font-size:15px}.ev .tt small{display:block;color:var(--mut);font-size:12px}.askp{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:8px auto}.msg{padding:10px 0;border-bottom:1px solid #eee;font-size:15px}.msg .st{font-size:12px;border-radius:10px;padding:2px 8px;font-weight:700;margin-left:6px}.st.w{background:#fff6dc;color:#8a6d00}.st.d{background:#e3f6e8;color:#1b7a3a}
.done-scr .m{font-size:30px;font-weight:800;color:var(--navy);margin-top:10px}
.prev{font-size:14px;color:var(--mut);margin-left:6px}
#login{position:fixed;inset:0;background:#f4f6fa;z-index:9999;display:none;align-items:center;justify-content:center}
#login .bx{background:#fff;border:1px solid #d6dbe4;border-radius:14px;padding:28px 26px;width:330px}
#login h2{margin:0 0 6px;color:var(--navy)}#login p{margin:0 0 14px;color:#667;font-size:13px;line-height:1.6}
#login input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
#login button{width:100%;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;cursor:pointer}
#login .err{color:#c0392b;font-size:13px;margin-top:6px;min-height:16px}
.setup .chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:8px 14px;margin:4px;cursor:pointer;background:#fff;font-size:15px}
.setup .chip.on{background:var(--navy);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2430;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;opacity:0;transition:.3s;pointer-events:none;z-index:9999}.toast.on{opacity:1}

/* v0.27 📝 시험지 */
.xrow{display:grid;grid-template-columns:38px repeat(5,1fr) 34px;align-items:center;gap:5px;padding:5px 6px;border-radius:10px;background:#fafbfd;margin-top:6px}
.xrow.ans{background:#fffdf3}.xrow .n{font-weight:700;color:var(--navy);text-align:right;padding-right:4px}
.bub{height:40px;border-radius:50%;border:2px solid #9aa3b5;background:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;color:#5a6476;font-family:inherit;padding:0}
.bub.on{background:var(--navy);border-color:var(--navy);color:#fff}
.subj{grid-column:2/7;min-height:40px;border:2px solid #9aa3b5;border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 12px;font-size:19px}
.subj.empty{color:#9aa3b5;font-size:14px}
.cam{height:40px;border-radius:10px;border:1.5px dashed #9aa3b5;background:#fff;font-size:17px;padding:0}.cam.has{border-style:solid;border-color:var(--ok);background:#eefaf1}
.kp{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 12px 18px;box-shadow:0 -4px 16px #0002;display:none;z-index:99}.kp.on{display:block}
.kp .kprev{min-height:48px;border:2px solid var(--yel);border-radius:12px;display:flex;align-items:center;padding:4px 14px;font-size:24px;background:#fffdf3;margin-bottom:8px;justify-content:space-between}
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.kg button{height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-family:inherit;color:#1d2430;padding:0}
.kg button.f{background:#eef1f8;color:var(--navy);font-weight:700}.kg button.ok{background:var(--navy);color:#fff;font-weight:700;grid-column:span 2}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 3px}.frac span{padding:0 4px}.frac span:first-child{border-bottom:2px solid #1d2430}
.sqrt{display:inline-block;margin:0 2px}.sqrt .in{border-top:2px solid #1d2430;padding:0 3px}
.xtimer{font-size:46px;font-weight:800;color:var(--navy);text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:6px 0}
.xpaper{display:flex;gap:10px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;background:#fff;cursor:pointer}.xpaper.done{opacity:.65}
.xpaper .t{font-weight:700}.xpaper .s{font-size:13px;color:var(--mut)}
.xstat{background:#f7f8fb;border-radius:12px;padding:12px;text-align:center}.xstat b{display:block;font-size:28px;color:var(--navy)}.xstat span{font-size:13px;color:var(--mut)}
.xbar{height:10px;background:#e8ebf2;border-radius:6px;overflow:hidden;margin-top:4px}.xbar i{display:block;height:100%;background:var(--navy)}
.xtag{display:inline-block;background:#fff0ee;color:#c0392b;border-radius:8px;padding:2px 8px;font-size:14px;margin:2px}.xtag.p{background:#fff8e1;color:#8a6500}
.xfact{background:#f7f8fb;border-left:4px solid var(--yel);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px;line-height:1.55;margin-top:10px}
.chipx{display:inline-block;border-radius:20px;padding:5px 11px;font-size:13px;background:#eef1f8;color:var(--navy);margin:2px;cursor:pointer}.chipx.on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<div class="top"><button id="hBack" style="display:none;margin-right:6px;font-size:16px;padding:5px 11px">←</button><h1 id="hTtl">🙋 오늘 기록</h1><span class="cn" id="cn"></span><span class="sp"><span id="conn"></span></span></div>
<div class="wrap" id="out"><div class="card">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<script>
/* 백수학_학생폰 v0.55 (원장 11-10 17:10 오답 다시 푼 답 칸 옆 기호 버튼 / √ − 「필요 없을 것 같아」 → 뺌 · 답 칸 + [확인]만) */
/* 백수학_학생폰 v0.54 (원장 11-10 17:02~17:03 「숙제 덜 함도 오답 탭 쪽으로 보내서 채점」·「그 안에서 다른 탭으로」·「채점은 와서 한 번만 들어가 봐도 되도록」 → ⬜ 숙제 덜 함 = 저장(DB result todo) · 📕 오답 방 맨 위 탭 [📕 오답 n][📝 덜 한 숙제 m] · 📝 탭 = 채점과 같은 선택지 ⭕△❌❓➖⬜(처음엔 ⬜) → stu_grade 저장(원장 17:04 「오답 탭은 기입 방식, 덜 한 숙제 탭은 채점 방식 OX — 선택지 같게」) · 채점 저장 뒤 카드에 둘 다) */
/* 백수학_학생폰 v0.53 (원장 11-10 17:01 「➖는 다시 — 쌤이 안 풀고 지나가도 된다고 한 것」 → 안내 「➖ 안 풀어도 됨 (쌤이 빼 준 것)」 · 저장 방식은 원래대로 skip) */
/* 백수학_학생폰 v0.52 (원장 11-10 17:00 「기호 하나당 한 줄만 보이게 — 줄에 내용 섞여서 가독성 엄청 떨어짐」 → 안내 표: 기호 칸 + 짧은 말, 줄바꿈 없음) */
/* 백수학_학생폰 v0.51 (원장 11-10 16:58 채점 안내 문구 자세히: 처음엔 전부 ⭕ · △ 맞긴 했는데 정확히 아는 것 같지 않음 · ❌ 틀림 · ❓ 모르겠어서 질문 · ➖ 아직 안 푼 것 · ⬜ 숙제를 아직 제대로 못 한 것 — 한 줄씩 목록으로) */
/* 백수학_학생폰 v0.50 (원장 11-10 16:56 「오답 쪽에서 다시 고쳤다는 표식이 가면 채점의 🔁 틀렸다 고쳐서 맞음은 필요 없음 — 버튼이 너무 많아」 → 채점 줄 🔁 버튼 뺌(⭕△❌❓➖⬜) · 틀린 건 저장 뒤 📕 오답 탭에서 ⭕ · 옛 저장분 🔁는 그대로 보임) */
/* 백수학_학생폰 v0.49 (원장 11-10 16:51 스샷: 오답 탭 줄 — 교재명·쪽·번호가 한 글자씩 세로로 찌그러짐 → 글 한 줄 전체 폭, 버튼 [⭕ 종이로 풀었어 맞았어][❓ 쌤한테]는 그 아래 줄로) */
/* 백수학_학생폰 v0.48 (원장 11-10 16:42~43 「오답만 다시 누르는 게 어디냐고 물어봄」·「오답 고칠 게 몇 문제인지 한눈에 보이게 오답 탭으로 보내는 게 맞음」: 채점 저장 뒤 = 「📕 고칠 오답 n개 [오답 고치러 가기]」 → 📕 오답 탭으로 이동(창 안 목록 뺌) · 현관 퀘스트 버튼도 오답 탭으로 · 오답 탭 맨 위 「고칠 것 n개」) */
/* 백수학_학생폰 v0.37 (02:4x 원장(꽉찬수학 앱 참고 + 학생 불편): ① 채점 「🔁 고쳐서 맞힘」 한 번에(❌ 기록 + 바로 다시 맞힘 — 다시 들어와 ⭕로 고칠 필요 없음) ② 📕 오답 다시 풀기 = 답 입력 → 자동 채점(단위 무시), 기회 2번, 2번 틀리면 ❓ 쌤한테 자동 · 서술형 등 자동 불가면 ✅ 맞혔어 · 새끼문제는 틀린 ⑵만 · 진행 막대 고친 것/남은 것) */
/* 백수학_학생폰 v0.36 (02:3x 원장 「오는 요일까지 자동」 — 메이크에듀 시간표 부정확: 🏁에서 시간표 없는 학생만 「🗓 학원 오는 요일 — 한 번만」(요일 칩·시작 30분 단위·길이) → stu_sched_set → 프로필 sched2·sched 글 · 있으면 작은 한 줄 [바꾸기] · 정시인데 시작 10분 넘었으면 확인 토스트) */
/* 백수학_학생폰 v0.35 (02:2x 원장 「알림장에 매일 나갈 항목 대부분 학생이 오자마자 고르게 — 정시 도착·몇 분 지각부터」: 🏁 맨 위 🏫 오늘 도착 [정시][5분][10분][15분][20분 넘게][아직 가는 중] + 누른 시각 · 🏠 「오늘 나는?」 집중 자기평가(쌤만 봄)) */
/* 백수학_학생폰 v0.34b (02:0x 원장 🧪테스트1호: 데일리 「📚 지금 교재」 바꿔도 학생이 오늘 이미 저장한 책이 이겨서 바로 안 뜸 → 쌤 로드맵 수정(rm_at)이 학생 저장보다 나중이면 쌤 것 우선 · 같은 책이면 쪽수 유지 · 쌤 ✕ 없음 = 지금 안 함) */
/* 백수학_학생폰 v0.34 (01:5x 비서, §HX·본부 06:1x 확정: 📝 시험 범위 — 쌤이 학교·학년 단위로 넣은 범위(exam_scopes)를 받아 쓰고, 학생도 단원 칩으로 바꿀 수 있음(내 것 우선) · 범위 밖 문제 5개↑ 시험지는 목록에서 빠짐·1~4개는 「범위 밖 n」 표시 + OMR에 회색·채점 제외 · 범위 없으면 시험대비 기간엔 매일 한 번 배너) */
/* 백수학_학생폰 v0.33c (01:09 원장: 버튼 6개가 답 칸 침범 → 채점 줄 두 줄 = 번호+답(가로) / 버튼 가로 넓게) */
/* 백수학_학생폰 v0.33b (00:5x 원장: 채점 줄마다 ⚠ 답지 오류 신고 — 정답 틀림·오타·번호 안 맞음·기타 + 한 줄 + 내 답 → student_msgs kind 오류 → 문제은행이 고침) */

    out.querySelectorAll('[data-hp]').forEach(function(b){b.onclick=function(){F.hwc[+b.getAttribute('data-hp')].pct=+b.getAttribute('data-v');form();};});
    out.querySelectorAll('[data-bk]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-bk'),i=+b.getAttribute('data-i');sync();F[k][i].book=b.getAttribute('data-v');form();};});
    out.querySelectorAll('[data-bkx]').forEach(function(b){b.onclick=function(){var k=b.getAttribute('data-bkx'),i=+b.getAttribute('data-i'),v=prompt('책 이름을 써 줘 (예: 수학의 바이블 대수)');if(v&&v.trim()){sync();F[k][i].book=v.trim();try{var mb=JSON.parse(LS('bzs_mybooks')||'[]');if(mb.indexOf(v.trim())<0){mb.unshift(v.trim());LS('bzs_mybooks',JSON.stringify(mb.slice(0,8)));}}catch(e){}form();}};});
    out.querySelectorAll('[data-to]').forEach(function(el){el.oninput=function(){F[el.getAttribute('data-to')][+el.getAttribute('data-i')].to=el.value;};});
    out.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){sync();F[b.getAttribute('data-add')].push({book:'',to:''});form();};});
    out.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){sync();F[b.getAttribute('data-del')].splice(+b.getAttribute('data-i'),1);form();};});
    out.querySelectorAll('[data-sb]').forEach(function(b){b.onclick=function(){sync();var kk=b.getAttribute('data-sb'),x=F.slots[kk];x.book=b.getAttribute('data-v');x.none=false;BKOPEN[kk]=false;form();};});
    out.querySelectorAll('[data-bko]').forEach(function(b){b.onclick=function(){sync();BKOPEN[b.getAttribute('data-bko')]=true;form();};});
    out.querySelectorAll('[data-bdn]').forEach(function(b){b.onclick=function(){sync();var k=b.getAttribute('data-bdn'),x=F.slots[k];if(!x.book)return;if(!confirm('📚 '+x.book+' — 정말 다 끝냈어?'))return;F.done=(F.done||[]).filter(function(d){return d.book!==x.book;}).concat([{slot:k,book:x.book,last:x.to||''}]);x.done_prev=x.book;x.book='';x.to='';BKOPEN[k]=true;BKWHY=null;form();};});
    out.querySelectorAll('[data-bch]').forEach(function(b){b.onclick=function(){sync();var k=b.getAttribute('data-bch');BKWHY=BKWHY===k?null:k;form();};});
    out.querySelectorAll('[data-bwy]').forEach(function(b){b.onclick=function(){sync();var k=b.getAttribute('data-bwy'),x=F.slots[k];F.chg=(F.chg||[]).filter(function(d){return d.slot!==k;}).concat([{slot:k,book:x.book,why:b.getAttribute('data-v')}]);BKWHY=null;BKOPEN[k]=true;form();};});
    out.querySelectorAll('[data-bun]').forEach(function(b){b.onclick=function(){sync();var k=b.getAttribute('data-bun'),x=F.slots[k],bk=x.done_prev;F.done=(F.done||[]).filter(function(d){return d.book!==bk;});var last=null;x.book=bk;x.done_prev='';BKOPEN[k]=false;form();};});
    out.querySelectorAll('[data-bwx]').forEach(function(b){b.onclick=function(){BKWHY=null;form();};});
    out.querySelectorAll('[data-sn]').forEach(function(b){b.onclick=function(){sync();var kk=b.getAttribute('data-sn'),x=F.slots[kk];x.none=!x.none;BKOPEN[kk]=false;form();};});
    out.querySelectorAll('[data-sbx]').forEach(function(b){b.onclick=function(){var v=prompt('책 이름을 써 줘');if(v&&v.trim()){sync();var x=F.slots[b.getAttribute('data-sbx')];x.book=v.trim();x.none=false;BKOPEN[b.getAttribute('data-sbx')]=false;try{var mb=JSON.parse(LS('bzs_mybooks')||'[]');if(mb.indexOf(v.trim())<0){mb.unshift(v.trim());LS('bzs_mybooks',JSON.stringify(mb.slice(0,8)));}}catch(e){}form();}};});
    out.querySelectorAll('[data-st2]').forEach(function(el){el.oninput=function(){F.slots[el.getAttribute('data-st2')].to=el.value;};});
    var ta=document.getElementById('tAdd');if(ta)ta.onclick=function(){sync();F.tests.push({name:'',score:''});form();};
    out.querySelectorAll('[data-tdel]').forEach(function(b){b.onclick=function(){sync();F.tests.splice(+b.getAttribute('data-tdel'),1);form();};});
    document.getElementById('send').onclick=send;}
  function sync(){out.querySelectorAll('[data-st2]').forEach(function(el){F.slots[el.getAttribute('data-st2')].to=el.value;});out.querySelectorAll('[data-to]').forEach(function(el){F[el.getAttribute('data-to')][+el.getAttribute('data-i')].to=el.value;});
    out.querySelectorAll('[data-tn]').forEach(function(el){F.tests[+el.getAttribute('data-tn')].name=el.value;});
    out.querySelectorAll('[data-ts]').forEach(function(el){F.tests[+el.getAttribute('data-ts')].score=el.value;});
    var sy=document.getElementById('say');if(sy)F.say=sy.value;}
  function send(){sync();var data;
    if(MODE==='start'&&FIRSTB){var c0=F.slots.concept;if(!c0||!c0.book){toast('📖 개념서(진도 책)를 골라 줘');return;}var b0={};SLOTS.forEach(function(sl){var x=F.slots[sl[0]];b0[sl[0]]=(x.none||!x.book)?{none:1}:{book:x.book};});data={books0:b0,at_start:new Date().toISOString()};}
    else if(shotNeed()&&SHOT.phase!=='during'){toast('📸 학교 시험지부터 올려 줘 (없으면 이유 고르기)');shotScr(function(){form();setTimeout(send,60);});return;}
    else if(MODE==='start'){if(F.hwc.some(function(i){return i.pct==null;})){toast('📌 숙제마다 얼마나 했는지 눌러 줘');return;}
      if(F.arr==null){toast('🏫 오늘 도착부터 눌러 줘');return;}
      data={hwc:F.hwc.map(function(i){return {book:i.book,range:i.range,pct:i.pct};}),at_start:new Date().toISOString(),arr:{late:F.arr,at:new Date().toISOString()}};if(F.school&&F.school.length)data.school=F.school;if(F.plan&&F.plan.length)data.plan=F.plan;}
    else if(!SLOTS.some(function(sl){var x=F.slots[sl[0]];return !x.none&&x.book&&String(x.to).trim();})&&TDD&&(+TDD.graded||+TDD.fixed||+TDD.exams)){/* 원장 16:39 「굳이 누르지 않아도」 — 진도 비었고 오늘 기록 있으면 자동으로 진도 없는 날 */data={no_prog:true,learn:[],hw:[],at_end:new Date().toISOString(),today_done:TDD};if(F.prep&&F.prep.length)data.prep=F.prep;if(F.hard){var hd0=hardData();if(hd0)data.hard=hd0;}if(F.sc){data.sched_chg=F.sc;data.sched_ok=!F.sc.length&&!!F.scOk;}}
    else{var c=F.slots.concept;if(!c.book||!String(c.to).trim()){toast('📖 개념서 — 어떤 책 몇 쪽까지 나갔는지 넣어 줘');return;}
      var miss=SLOTS.filter(function(sl){var x=F.slots[sl[0]];return !x.none&&x.book&&!String(x.to).trim();})[0];if(miss){toast(miss[1]+' — 쪽 번호 넣어 줘 (안 하면 「🚫 지금 안 함」)');return;}
      var slots={},learn=[],hw=[],adv=false,known=0;SLOTS.forEach(function(sl){var k=sl[0],x=F.slots[k];if(x.none||!x.book){slots[k]={none:1};return;}var st=startOfS(k,x),to=+x.to;if(st!=null){known++;if(st<=to)adv=true;}var it={book:x.book,to:to,range:(st!=null&&st<=to?st+'~':'')+to+'쪽'};slots[k]=it;(sl[3]==='learn'?learn:hw).push(it);});/* v0.47 원장 16:39 「진도 페이지가 기존과 달라질 게 없고 오답만 고친 거 — 자동으로 검수해서 알림장」 */var noAdv=known>0&&!adv;
      data={slots:slots,learn:learn,hw:hw,tests:F.tests.filter(function(t){return t.name||t.score!=='';}).map(function(t){return {name:t.name||'테스트',score:t.score===''?'':+t.score};}),say:(F.say||'').trim(),at_end:new Date().toISOString()};if(F.self)data.self=F.self;if(F.done&&F.done.length)data.book_done=F.done;if(F.chg&&F.chg.length)data.book_change=F.chg;if(F.hard){var hdd=hardData();if(hdd)data.hard=hdd;}if(F.sc){data.sched_chg=F.sc;data.sched_ok=!F.sc.length&&!!F.scOk;}if(F.prep&&F.prep.length)data.prep=F.prep;if(TDD)data.today_done=TDD;if(noAdv)data.no_prog=true;}
    var b=document.getElementById('send');b.disabled=true;b.textContent='보내는 중…';
    (data.dev=DEV,SB.rpc('stu_submit',{p_code:CODE,p_data:data})).then(function(r){
      if(r.error||r.data!==true){b.disabled=false;b.textContent='보내기 ✅';toast('저장 안 됨 — 다시 눌러 줘'+(r.error?' ('+r.error.message+')':''));return;}
      var m=CTX.mine||{};Object.keys(data).forEach(function(k){m[k]=data[k];});CTX.mine=m;var st=MODE==='start';if(st&&data.school&&data.school.indexOf('exam')>=0&&!(SHOT&&+SHOT.n>0)){toast('👍 보냈어! 이제 시험지 올려 줘');shotScr(function(){form();toast('📸 고마워! 수업 잘 듣자');});return;}setTimeout(function(){gLoad(true);},500);if(data.books0){toast('📚 내 책 저장! 이제 채점도 이 책으로 떠');FIRSTB=false;form();return;}
      out.innerHTML='<div class="card done-scr"><div class="e">'+(st?'👍':'👋')+'</div><div class="m">'+esc(given(CTX.name))+(st?', 확인 끝! 수업 잘 듣자':', 보냈어! 조심히 가~')+'</div><div class="hint" style="margin-top:10px">'+(st?'수업 끝나면 「🏠 집에 가기 전」도 잊지 마':'쌤이 확인하고 부모님께 알림장 보내요')+' · 고칠 게 있으면 다시 열면 돼</div><button class="back" style="margin-top:20px" id="again">✏️ 고치기</button></div>';
      document.getElementById('again').onclick=function(){open0(MODE);};});}
  load();
})();
